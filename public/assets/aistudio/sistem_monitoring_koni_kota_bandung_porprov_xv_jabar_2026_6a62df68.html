                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        let isChatOpen = false;
        function toggleChatbot() {
            isChatOpen = !isChatOpen;
            const container = document.getElementById('chat-widget-container');
            const btn = document.getElementById('chat-toggle-btn');
            if (isChatOpen) {
                container.classList.remove('hidden');
                btn.classList.add('hidden');
            } else {
                container.classList.add('hidden');
                btn.classList.remove('hidden');
            }
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const messagesContainer = document.getElementById('chat-messages');
            
            // Append user message
            messagesContainer.innerHTML += `
                <div class="flex gap-2 justify-end">
                    <div class="bg-blue-600 text-white p-3 rounded-2xl shadow-xs max-w-[80%]">
                        ${escapeHtml(text)}
                    </div>
                </div>
            `;
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Append typing indicator
            const typingId = 'typing-' + Date.now();
            messagesContainer.innerHTML += `
                <div id="${typingId}" class="flex gap-2">
                    <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-[10px] shrink-0">AI</div>
                    <div class="bg-white p-3 rounded-2xl border border-slate-200 text-slate-500 shadow-xs">
                        Sedang berpikir...
                    </div>
                </div>
            `;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {

                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                
                const payload = {
                    contents: [{ parts: [{ text: text }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                activity: `Inspeksi Tim Monev: Rating [${document.getElementById('fm_rating').value}]`,
                constraints: document.getElementById('fm_findings').value,
                status: document.getElementById('fm_rating').value === 'Kritis' ? 'Diproses' : 'Selesai',
                followup: document.getElementById('fm_recommendation').value,
                photo: document.getElementById('fm_photo').value
            });
            dbManager.saveDB(db);
            dbManager.logAudit(currentUser, 'Mengirim hasil monitoring & evaluasi lapangan baru dengan foto kunjungan.');
            closeModal();
            showToast('Hasil monitoring lapangan & foto berhasil disimpan!', 'success');
            renderApp();
        }

        function handleManageAthletesSubmit(e) {
            e.preventDefault();
            const db = dbManager.getDB();
            const action = document.getElementById('ma_action').value;
            const sportId = parseInt(document.getElementById('ma_sport_id').value);
            const sport = db.sports.find(s => s.id === sportId);

            if (action === 'add') {
                const name = document.getElementById('ma_name').value;
                if (!name) { showToast('Nama atlet wajib diisi.', 'error'); return; }
                db.athletes.unshift({
                    id: Date.now(),
                    name,
                    sport_id: sportId,
                    gender: document.getElementById('ma_gender').value,
                    club: document.getElementById('ma_club').value,
                    status: 'Aktif'
                });
                if (sport) sport.athletes_count++;
                db.app_settings.total_athletes++;
                db.app_settings.total_contingent++;
                dbManager.saveDB(db);
                dbManager.logAudit(currentUser, `Menambahkan atlet: ${name} ke cabor ${sport ? sport.name : ''}`);
                closeModal();
                showToast(`Atlet ${name} berhasil ditambahkan!`, 'success');
            } else {
                const athleteId = parseInt(document.getElementById('ma_athlete_id').value);
                const idx = db.athletes.findIndex(a => a.id === athleteId);
                if (idx !== -1) {
                    const removed = db.athletes.splice(idx, 1)[0];
                    if (sport && sport.athletes_count > 0) sport.athletes_count--;
                    db.app_settings.total_athletes = Math.max(0, db.app_settings.total_athletes - 1);
                    db.app_settings.total_contingent = Math.max(0, db.app_settings.total_contingent - 1);
                    dbManager.saveDB(db);
                    dbManager.logAudit(currentUser, `Mengeluarkan atlet: ${removed.name}`);
                    closeModal();
                    showToast(`Atlet ${removed.name} berhasil dikeluarkan.`, 'success');
                }
            }
            renderApp();
        }

        function quickRemoveAthlete(athleteId) {
            if (!confirm('Apakah Anda yakin ingin mengeluarkan atlet ini?')) return;
            const db = dbManager.getDB();
            const idx = db.athletes.findIndex(a => a.id === athleteId);
            if (idx !== -1) {
                const removed = db.athletes.splice(idx, 1)[0];
                const sport = db.sports.find(s => s.id === removed.sport_id);
                if (sport && sport.athletes_count > 0) sport.athletes_count--;
                db.app_settings.total_athletes = Math.max(0, db.app_settings.total_athletes - 1);
                db.app_settings.total_contingent = Math.max(0, db.app_settings.total_contingent - 1);
                dbManager.saveDB(db);
                dbManager.logAudit(currentUser, `Mengeluarkan atlet: ${removed.name}`);
                showToast(`Atlet ${removed.name} berhasil dikeluarkan.`, 'success');
                renderApp();
            }
        }

        function exportData(format) {
            const db = dbManager.getDB();
            if (format === 'csv') {
                let csv = 'ID,Nama Atlet,Cabang Olahraga,Klub Asal,Status\n';
                db.athletes.forEach(a => {
                    csv += `${a.id},"${a.name}",${a.sport_id},"${a.club}",${a.status}\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'kontingen_koni_bandung_porprov_2026.csv';
                a.click();
                showToast('Ekspor CSV berhasil diunduh!', 'success');
            } else if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("helvetica", "bold");
                doc.setFontSize(16);
                doc.text("Laporan Resmi Kontingen KONI Kota Bandung", 14, 20);
                doc.setFontSize(11);
                doc.setFont("helvetica", "normal");
                doc.text("PORPROV XV Jawa Barat 2026", 14, 28);
                doc.text(`Total Atlet: ${db.app_settings.total_athletes}`, 14, 40);
                doc.text(`Total Cabang Olahraga: ${db.app_settings.total_sports}`, 14, 48);
                doc.text(`Target Emas: ${db.app_settings.target_gold_potential}`, 14, 56);
                doc.save("laporan_koni_bandung_porprov_2026.pdf");
                showToast('Laporan PDF berhasil dicetak!', 'success');
            }
        }

        function renderTabContent(db, tabId) {
            switch (tabId) {
                case 'dashboard': return renderDashboard(db);
                case 'master': return renderMasterData(db);
                case 'fixtures': return renderFixtures(db);
                case 'posts': return renderPosts(db);
                case 'visit_photos': return renderVisitPhotos(db);
                case 'medals': return renderMedals(db);
                case 'medical': return renderMedical(db);
                case 'accommodation': return renderAccommodation(db);
                case 'protests': return renderProtests(db);
                case 'reports': return renderReports(db);
                case 'database_doc': return renderDatabaseDoc(db);
                default: return renderDashboard(db);
            }
        }

        window.onload = function() {
            renderApp();
        };
    </script>
